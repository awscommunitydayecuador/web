<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1280" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <!-- Base navy gradient -->
    <radialGradient id="base" cx="35%" cy="20%" r="120%">
      <stop offset="0%" stop-color="#07103D" />
      <stop offset="55%" stop-color="#040A2C" />
      <stop offset="100%" stop-color="#020824" />
    </radialGradient>

    <!-- Top blue glow -->
    <radialGradient id="blueGlow" cx="50%" cy="0%" r="38%">
      <stop offset="0%" stop-color="#4FA7FF" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#2D63FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2D63FF" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan accent left -->
    <radialGradient id="cyanGlow" cx="8%" cy="32%" r="35%">
      <stop offset="0%" stop-color="#89C8FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#4FA7FF" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom-right magenta glow -->
    <radialGradient id="magentaGlow" cx="80%" cy="92%" r="55%">
      <stop offset="0%" stop-color="#A248FF" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#6C3CF2" stop-opacity="0.32" />
      <stop offset="75%" stop-color="#35184F" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#35184F" stop-opacity="0" />
    </radialGradient>

    <!-- Deep purple lobe -->
    <radialGradient id="deepPurple" cx="62%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#35184F" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#020824" stop-opacity="0" />
    </radialGradient>

    <!-- Dotted halftone pattern -->
    <pattern id="dots" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#89C8FF" />
    </pattern>

    <!-- Soft mask so dots fade across the canvas -->
    <linearGradient id="dotsMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000" />
      <stop offset="35%" stop-color="#000" />
      <stop offset="65%" stop-color="#fff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.85" />
    </linearGradient>
    <mask id="dotsClip">
      <rect width="1920" height="1280" fill="url(#dotsMask)" />
    </mask>

    <!-- Curve highlight gradients -->
    <linearGradient id="curve1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FA7FF" stop-opacity="0" />
      <stop offset="40%" stop-color="#89C8FF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#4FA7FF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="curve2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A248FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#8B5CFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#A248FF" stop-opacity="0" />
    </linearGradient>

    <!-- Noise -->
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" stitchTiles="stitch" />
      <feColorMatrix values="0 0 0 0 0.55 0 0 0 0 0.65 0 0 0 0 1 0 0 0 0.18 0" />
    </filter>
  </defs>

  <!-- Layered fills -->
  <rect width="1920" height="1280" fill="url(#base)" />
  <rect width="1920" height="1280" fill="url(#deepPurple)" />
  <rect width="1920" height="1280" fill="url(#magentaGlow)" />
  <rect width="1920" height="1280" fill="url(#cyanGlow)" />
  <rect width="1920" height="1280" fill="url(#blueGlow)" />

  <!-- Halftone dots -->
  <rect width="1920" height="1280" fill="url(#dots)" mask="url(#dotsClip)" opacity="0.55" />

  <!-- Decorative wave curves (top) -->
  <path d="M -50,360 C 360,260 760,300 1080,210 C 1380,130 1620,180 1980,140"
        stroke="url(#curve1)" stroke-width="2.2" fill="none" opacity="0.9" />
  <path d="M -50,420 C 380,330 820,360 1180,290 C 1480,230 1700,280 1980,250"
        stroke="url(#curve1)" stroke-width="1.4" fill="none" opacity="0.55" />

  <!-- Decorative wave curves (bottom) -->
  <path d="M -50,940 C 460,820 940,900 1320,800 C 1620,720 1800,760 1980,720"
        stroke="url(#curve2)" stroke-width="2" fill="none" opacity="0.85" />
  <path d="M -50,1000 C 480,880 980,960 1360,860 C 1660,780 1840,820 1980,800"
        stroke="url(#curve2)" stroke-width="1.2" fill="none" opacity="0.5" />

  <!-- Subtle noise layer -->
  <rect width="1920" height="1280" filter="url(#noise)" opacity="0.35" />
</svg>
